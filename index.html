<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRISCRIPTS | Official Execution Hub</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #0c0d10;
            --accent-lime: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.25);
            --border-color: #1a1d24;
            --text-primary: #ffffff;
            --text-secondary: #8a8f9d;
            --code-bg: #030406;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Background Grid FX */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
        }

        /* Navigation */
        nav {
            width: 100%;
            max-width: 1000px;
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--accent-lime);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .logo span {
            color: var(--accent-lime);
        }

        .status-badge {
            background-color: rgba(0, 255, 102, 0.1);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: var(--accent-lime);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-lime);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-lime);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            margin: auto 0;
        }

        .glass-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 1px 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-lime), transparent);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Features Badges */
        .features {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .feature-tag {
            background-color: #12151c;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feature-tag i {
            color: var(--accent-lime);
        }

        /* Code Block */
        .code-wrapper {
            position: relative;
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: left;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .code-box {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--accent-lime);
            word-break: break-all;
            line-height: 1.5;
        }

        /* Primary Button */
        .btn-copy {
            background-color: var(--accent-lime);
            color: #000000;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
            background-color: #1aff75;
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: center;
        }

        footer a {
            color: var(--accent-lime);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav>
        <div class="logo">
            <i class="fa-solid fa-terminal"></i> AMIRI<span>SCRIPTS</span>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div> Undetected
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="glass-card">
            <h1>Execution Hub</h1>
            <p class="subtitle">Copy and paste the loadstring directly into your executor.</p>

            <!-- Feature Tags -->
            <div class="features">
                <div class="feature-tag"><i class="fa-solid fa-crosshair"></i> Color Aimbot</div>
                <div class="feature-tag"><i class="fa-solid fa-circle-notch"></i> FOV Circle</div>
                <div class="feature-tag"><i class="fa-solid fa-bolt"></i> Fast Config</div>
            </div>

            <!-- Code Display -->
            <div class="code-wrapper">
                <div class="code-header">
                    <span>LUA LOADSTRING</span>
                    <i class="fa-regular fa-code"></i>
                </div>
                <div class="code-box" id="luaCode">loadstring(game:HttpGet("https://pastebin.com/raw/YOUR_SCRIPT_ID"))()</div>
            </div>

            <!-- Action Button -->
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">
                <i class="fa-regular fa-copy"></i> Copy Loadstring
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a> • Built for AMIRISCRIPTS</p>
    </footer>

    <!-- Script Logic -->
    <script>
        function copyToClipboard() {
            const codeText = document.getElementById("luaCode").innerText;
            const btn = document.getElementById("copyBtn");

            navigator.clipboard.writeText(codeText).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied to Clipboard!`;
                btn.style.backgroundColor = "#ffffff";
                btn.style.color = "#000000";
                
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy Loadstring`;
                    btn.style.backgroundColor = "var(--accent-lime)";
                }, 2000);
            });
        }
    </script>
</body>
</html>
